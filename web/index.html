<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traseu de noapte — Timișoara</title>
<!-- street light icon: Magnific / Flaticon (free licence, credited in the map attribution) -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --ink: #141414; --muted: #555; --line: #ddd; --focus: #0b57d0; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--ink); background: #fff; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; min-height: 320px; background: #f3f3f1; }
  #panel { width: 380px; max-width: 100%; overflow: auto; padding: 14px 16px; border-left: 1px solid var(--line); box-sizing: border-box; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .langs { display: flex; gap: 4px; }
  .langs button { font: inherit; font-size: 12px; padding: 3px 7px; border: 1px solid #888; border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
  .places { display: grid; grid-template-columns: 24px 1fr auto; gap: 6px 8px; align-items: center; margin: 8px 0 10px; }
  .pin-label { width: 24px; height: 24px; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center;
               justify-content: center; font-weight: 700; font-size: 13px; }
  .box { position: relative; min-width: 0; }
  .box input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid #888; border-radius: 8px; }
  .suggest { position: absolute; z-index: 1000; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 4px 0; list-style: none; background: #fff;
             border: 1px solid #888; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.18); max-height: 330px; overflow: auto; }
  .suggest li { padding: 6px 10px; cursor: pointer; }
  .suggest li[aria-selected="true"], .suggest li:hover { background: #e8eefc; }
  .suggest li.empty { color: var(--muted); cursor: default; background: none; }
  .suggest .sub { display: block; font-size: 12px; color: var(--muted); }
  .icon-btn { font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid #555; border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .modes-caption { color: var(--muted); font-size: 13px; align-self: center; }
  .travel { display: flex; gap: 6px; margin: 0 0 10px; }
  .travel label { flex: 1; text-align: center; border: 1px solid #888; border-radius: 8px; padding: 7px 8px; cursor: pointer; font-weight: 600; }
  .travel label:has(input:checked) { background: #111; color: #fff; border-color: #111; }
  .travel input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .travel label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .at { margin: -2px 0 10px; font-size: 13px; }
  .at input { font: inherit; font-size: 15px; padding: 4px 6px; border: 1px solid #888; border-radius: 6px; }
  .at small { color: var(--muted); }
  .card.info { cursor: default; }
  .signs { margin: 8px 0 0; padding-top: 6px; border-top: 1px solid #eee; font-size: 13px; }
  .signs-title { font-weight: 600; }
  .card .signs li { display: list-item; list-style: disc; margin: 2px 0 0 16px; }
  .card .legs li { display: list-item; margin: 0 0 3px 16px; list-style: disc; }
  .card .legs { margin: 4px 0 0; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  #hint { margin: 6px 0 10px; }
  .gray-tiles { filter: grayscale(1) brightness(1.05) contrast(.9); }
  .modes { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
  .modes label { border: 1px solid #888; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .modes input { margin-right: 4px; }
  .card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: #fff; border: 2px solid var(--line);
          border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; cursor: pointer; }
  .card.selected { border-color: #111; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .card:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .card .title { display: block; font-weight: 600; }
  .card .main { display: block; font-size: 20px; font-weight: 600; margin: 2px 0 6px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #eee; margin-bottom: 6px; }
  .bar span { display: block; height: 100%; }
  .card ul, .legend { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  .card li, .legend li { display: flex; align-items: center; gap: 8px; }
  .sw { flex: 0 0 26px; height: 0; border-top-width: 4px; }
  .warn { margin: 6px 0 0; padding: 6px 8px; background: #fff3e6; border-left: 4px solid #D55E00; font-size: 13px; }
  .error { margin: 6px 0 10px; padding: 6px 8px; background: #fdecea; border-left: 4px solid #b3261e; }
  .verdict { margin: 6px 0 0; font-size: 13px; }
  .verdict.ok { color: #006b4f; } .verdict.bad { color: #a13d00; }
  /* how the line ran on a recent day (Tiger Data): one sentence under the live box, the source behind a tap */
  .hist { margin: -4px 0 10px; padding: 7px 10px; background: #f4f1fa; border-left: 4px solid #6a3d9a; border-radius: 0 8px 8px 0; font-size: 13px; }
  .hist summary { cursor: pointer; list-style: none; }
  .hist summary::-webkit-details-marker { display: none; }
  .hist-more { color: #5b3a8a; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  .hist[open] .hist-more { display: none; }
  .hist p { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
  .via, .small { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .controls { display: flex; gap: 14px; align-items: center; margin: 4px 0 10px; flex-wrap: wrap; }
  .controls button { font: inherit; padding: 6px 12px; border: 1px solid #555; border-radius: 6px; background: #fff; cursor: pointer; }
  details { margin: 6px 0; font-size: 13px; }
  code { font-size: 12px; background: #f2f2f2; padding: 1px 4px; border-radius: 4px; }
  .pin { background: #111; color: #fff; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.5);
         display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .leaflet-tooltip.zone-name { background: rgba(255,255,255,.88); border: 1px solid #1d3f8f; box-shadow: none; color: #10245a;
         font-size: 11px; line-height: 1.2; text-align: center; padding: 2px 5px; }
  .leaflet-tooltip.zone-name:before { display: none; }
  .leaflet-popup-content ul { margin: 6px 0 4px 16px; padding: 0; }
  .ask { margin: 8px 0 12px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #f6f7fa; }
  .ask-row { display: flex; gap: 6px; }
  .ask-row input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid #888; border-radius: 8px; }
  .ask-row button:disabled { opacity: .5; cursor: default; }
  #ask-mic[aria-pressed="true"] { background: #b3261e; border-color: #b3261e; color: #fff; }
  .ask p { margin: 6px 0 0; }
  .ask-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ask-choices[hidden] { display: none; }
  .ask-choices p { flex-basis: 100%; font-size: 13px; }
  .ask-choices button { min-height: 40px; max-width: 100%; white-space: normal; text-align: left; }
  /* live public transport: the box under the transit card and the vehicle markers */
  .live-box { margin: -4px 0 10px; padding: 8px 10px; background: #f3f6fd; border-left: 4px solid #2b4fb3; border-radius: 0 8px 8px 0; font-size: 13px; }
  .live-box p { margin: 0 0 4px; }
  .live-box .live-main { font-size: 15px; font-weight: 600; }
  .live-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; }
  .live-tag.on { color: #006b4f; } .live-tag.on::before { content: "\25CF "; } .live-tag.off { color: #555; }
  .live-box button { font: inherit; padding: 4px 10px; border: 1px solid #555; border-radius: 6px; background: #fff; cursor: pointer; }
  .veh { position: relative; }
  .veh-num { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #fff;
             box-shadow: 0 1px 4px rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; font: 700 11px/1 system-ui, sans-serif; }
  .veh-arrow { position: absolute; left: 0; top: 0; width: 30px; height: 30px; }
  .veh-arrow::before { content: ""; position: absolute; left: 10px; top: -5px; border: 5px solid transparent; border-top: 0; border-bottom: 8px solid #111; }
  .veh.mine .veh-num { left: -1px; top: -1px; width: 32px; height: 32px; border-width: 3px; font-size: 13px; outline: 2px solid #111; }
  .veh.old .veh-num { background: #9a9a9a !important; color: #111 !important; border-style: dashed; border-color: #333; }
  .veh.old .veh-arrow { display: none; }
  .veh.dim { opacity: .5; }
  @media (max-width: 800px) {
    #app { flex-direction: column; }
    #map { flex: 0 0 55vh; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); padding-inline: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside id="panel">
    <div class="top">
      <h1><span id="title"></span> <small id="subtitle"></small></h1>
      <div class="langs" id="langs" role="group"></div>
    </div>
    <form class="ask" id="ask" hidden>
      <div class="ask-row">
        <input id="ask-text" type="text" maxlength="300" autocomplete="off" enterkeyhint="search">
        <button type="button" class="icon-btn" id="ask-mic" aria-pressed="false"></button>
        <button type="submit" class="icon-btn" id="ask-go"></button>
      </div>
      <p class="small" id="ask-note" aria-live="polite" hidden></p>
      <div id="ask-choices" class="ask-choices" hidden></div>
      <p class="small" id="ask-privacy"></p>
    </form>
    <div class="places">
      <span class="pin-label" id="label-a" aria-hidden="true"></span>
      <div class="box"><input id="from" type="text" autocomplete="off" spellcheck="false"><ul class="suggest" id="from-list" hidden></ul></div>
      <button type="button" class="icon-btn" id="locate"></button>
      <span class="pin-label" id="label-b" aria-hidden="true"></span>
      <div class="box"><input id="to" type="text" autocomplete="off" spellcheck="false"><ul class="suggest" id="to-list" hidden></ul></div>
      <button type="button" class="icon-btn" id="swap">⇅</button>
    </div>
    <div class="travel" role="radiogroup" id="travel">
      <label><input type="radio" name="travel" value="walk" checked><span id="travel-walk"></span></label>
      <label><input type="radio" name="travel" value="bike"><span id="travel-bike"></span></label>
      <label><input type="radio" name="travel" value="transit"><span id="travel-transit"></span></label>
    </div>
    <p class="at" id="at-wrap"><label><span id="at-label"></span> <input type="time" id="at"></label> <small id="at-hint"></small></p>
    <div class="modes" role="radiogroup" id="modes">
      <span class="modes-caption" id="modes-caption"></span>
      <label><input type="radio" name="mode" value="route" checked><span id="mode-route"></span></label>
      <label><input type="radio" name="mode" value="inspect"><span id="mode-inspect"></span></label>
    </div>
    <p id="hint" aria-live="polite"></p>
    <div id="cards"></div>
    <div class="controls">
      <button id="reset" type="button"></button>
      <label><input type="checkbox" id="net" checked> <span id="net-label"></span></label>
      <label><input type="checkbox" id="live-net"> <span id="live-net-label"></span></label>
    </div>
    <details>
      <summary id="legend-title"></summary>
      <ul class="legend" id="legend"></ul>
      <p class="small" id="area-note"></p>
    </details>
    <p id="meta" class="small"></p>
  </aside>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="search.js"></script>
<script src="hist.js"></script>
<script src="/demo/layers/layers.js"></script>
<script src="app.js"></script>
<script src="ask.js"></script>
</body>
</html>
