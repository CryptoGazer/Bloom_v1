<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">
<title>bezna — Timișoara</title>
<!-- street light icon: Magnific / Flaticon (free licence, credited in the map attribution) -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* bezna · «Tihij svet» (design canvas "Traseu de noapte — redesign"): dark only, monochrome; status = tone + line pattern */
:root {
  --bz-bg: #0B0B0B; --bz-panel: #171717; --bz-raised: #202020; --bz-raised-2: #262626;
  --bz-line: #333333; --bz-edge: #4A4A4A;
  --bz-ink: #F2F2F2; --bz-ink-2: #A3A3A3; --bz-ink-3: #8A8A8A; --bz-on-light: #0B0B0B;
  --bz-transit: #6B6B6B;
  --bz-font: "Inter", system-ui, sans-serif; --bz-display: "Inter Tight", "Inter", sans-serif; --bz-mono: "JetBrains Mono", ui-monospace, monospace;
  --bz-r-chip: 8px; --bz-r-ctl: 12px; --bz-r-card: 14px; --bz-r-sheet: 20px; --bz-hit: 44px;
  --bz-ease-out: cubic-bezier(.33, 1, .68, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #000; }
body { font: 15px/22px var(--bz-font); color: var(--bz-ink); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--bz-ink); text-underline-offset: 3px; }
a:hover { color: #FFFFFF; }
:focus-visible { outline: 2px solid var(--bz-ink); outline-offset: 2px; }
input::placeholder { color: var(--bz-ink-3); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the phone: full screen on a phone, a centred column on a computer */
#phone { position: relative; max-width: 430px; height: 100%; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--bz-bg); }
@media (min-width: 600px) { #phone { border-left: 1px solid #1A1A1A; border-right: 1px solid #1A1A1A; } }
#map { position: absolute; inset: 0; background: var(--bz-bg); }
.leaflet-container { background: var(--bz-bg); font-family: var(--bz-font); }
/* OSM tiles, inverted to a dark grey ground: blocks and labels stay readable, our status lines do the talking */
.bz-tiles { filter: invert(1) grayscale(1) brightness(.62) contrast(1.25); }
.leaflet-control-attribution { background: rgba(11,11,11,.7) !important; color: var(--bz-ink-3); font-size: 10px; }
.leaflet-control-attribution a { color: var(--bz-ink-2); }
.bz-glow { filter: url(#bzglow); }
.bz-mk { background: none; border: 0; }
.bz-mk svg { display: block; overflow: visible; }
.bz-mk text { font-family: var(--bz-display); font-weight: 600; }
.mk-in { display: block; animation: mkin .25s var(--bz-ease-out) both; }
@keyframes mkin { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: none; } }
.bz-pulse { animation: bzpulse 2s var(--bz-ease-out) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bzpulse { from { opacity: .8; transform: scale(.7); } to { opacity: 0; transform: scale(1.6); } }
@media (prefers-reduced-motion: reduce) { .bz-pulse { animation: none; opacity: 0; } .mk-in { animation: none; } }

/* layers over the map */
.top { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 1100; display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.round { width: var(--bz-hit); height: var(--bz-hit); flex: none; border-radius: 999px; border: 1px solid var(--bz-line); background: var(--bz-panel);
         display: flex; align-items: center; justify-content: center; padding: 0; text-decoration: none; }
.round[aria-pressed="true"], .round[aria-expanded="true"] { border-color: var(--bz-ink); }
/* voice on / off (m.js, ACT.voice): on is a filled light button with a speaker, off an outlined crossed speaker */
.round.voice[aria-pressed="true"] { background: var(--bz-ink); color: var(--bz-on-light); border-color: var(--bz-ink); }
.actions .round.voice { width: 52px; height: 52px; border-radius: var(--bz-r-card); border-color: var(--bz-edge); background: var(--bz-raised); }
.actions .round.voice[aria-pressed="true"] { background: var(--bz-ink); border-color: var(--bz-ink); }
.pill { height: var(--bz-hit); padding: 0 14px; border-radius: 999px; border: 1px solid var(--bz-line); background: var(--bz-panel);
        font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.pill[aria-expanded="true"] { border-color: var(--bz-ink); }
.grow { flex: 1; }
.note-chip { position: absolute; left: 16px; top: 92px; z-index: 1050; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--bz-r-chip);
             background: var(--bz-panel); border: 1px solid var(--bz-line); font-size: 12px; line-height: 16px; color: var(--bz-ink-2); max-width: calc(100% - 32px); }
.map-chip { padding: 4px 8px; border-radius: var(--bz-r-chip); background: var(--bz-panel); border: 1px solid var(--bz-line); font-size: 12px; line-height: 16px;
            font-weight: 500; white-space: nowrap; color: var(--bz-ink); }
.map-chip.dim { color: var(--bz-ink-2); font-weight: 400; }
.map-chip.old { border-style: dashed; border-color: var(--bz-edge); color: var(--bz-ink-2); }
.plus-chip { width: 214px; padding: 9px 12px; border-radius: var(--bz-r-ctl); background: var(--bz-panel); border: 1px solid var(--bz-line);
             display: flex; flex-direction: column; gap: 2px; white-space: normal; }
.plus-chip b { font-family: var(--bz-display); font-size: 20px; line-height: 22px; font-weight: 600; }
.plus-chip span { font-size: 12px; line-height: 1.4; color: var(--bz-ink-2); }

/* bottom sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; max-height: calc(100% - 72px); overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: var(--bz-r-sheet) var(--bz-r-sheet) 0 0;
         background: var(--bz-panel); border-top: 1px solid var(--bz-line); display: flex; flex-direction: column; gap: 12px; }
.sheet.tall { max-height: calc(100% - 200px); }
.sheet { transition: transform .28s var(--bz-ease-out); }
.sheet.min { transform: translateY(calc(100% - 64px)); overflow: hidden; }
.sheet.dragging { transition: none; }
/* the top edge of a sheet: a wide strip to drag or tap, over the drawn handle */
.grip { position: absolute; left: 0; right: 0; top: 0; height: 30px; z-index: 2; padding: 0; border: 0; background: transparent; cursor: grab; touch-action: none; }
.grip:active { cursor: grabbing; }
.grip:focus-visible { outline-offset: -4px; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.handle { align-self: center; width: 36px; height: 4px; flex: none; border-radius: 2px; background: var(--bz-line); }
.full { position: absolute; inset: 0; z-index: 1200; background: var(--bz-bg); display: flex; flex-direction: column; overflow-y: auto; }
h1, h2, p { margin: 0; }
.h-title { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.h-sub { font-size: 13px; line-height: 1.45; color: var(--bz-ink-2); }
.h-route { font-size: 16px; font-weight: 600; line-height: 1.3; }
.muted { color: var(--bz-ink-2); }
.small { font-size: 12px; line-height: 1.5; color: var(--bz-ink-3); }
.sec { font-size: 13px; line-height: 18px; color: var(--bz-ink-2); }
.label { font-family: var(--bz-mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; color: var(--bz-ink-2); text-transform: uppercase; }
.mono { font-family: var(--bz-mono); }
.display-m { font-family: var(--bz-display); font-size: 34px; line-height: 38px; font-weight: 600; }

/* address fields */
.fields { display: flex; gap: 8px; align-items: stretch; }
.fields-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.field { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 4px 0 12px; border-radius: var(--bz-r-ctl);
         background: var(--bz-raised); border: 1px solid var(--bz-line); text-align: left; width: 100%; min-width: 0; }
.field:focus-within { border: 1.5px solid var(--bz-ink); box-shadow: 0 0 0 4px rgba(242,242,242,.06); }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 16px; outline: none; }
.field .ph { flex: 1; min-width: 0; font-size: 16px; color: var(--bz-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .val { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .icon-in { width: 44px; height: 44px; flex: none; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 999px; }
.pin-a { width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--bz-ink); color: var(--bz-on-light); font: 600 11px/1 var(--bz-display);
         display: flex; align-items: center; justify-content: center; }
.pin-b { width: 20px; height: 20px; flex: none; border-radius: 4px; background: var(--bz-bg); border: 1.5px solid var(--bz-ink); color: var(--bz-ink);
         font: 600 11px/1 var(--bz-display); display: flex; align-items: center; justify-content: center; }
.swap { width: 44px; flex: none; border-radius: var(--bz-r-ctl); border: 1px solid var(--bz-line); background: var(--bz-raised); display: flex; align-items: center; justify-content: center; }
.clear-x { width: 26px; height: 26px; border-radius: 999px; background: var(--bz-line); display: flex; align-items: center; justify-content: center; }

/* "how you go": segmented control */
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: var(--bz-r-card); background: var(--bz-bg); border: 1px solid var(--bz-line); }
.seg button { position: relative; height: 44px; border-radius: 11px; border: 1px solid transparent; background: transparent; color: var(--bz-ink-2);
              font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 4px; }
.seg button[aria-pressed="true"] { border-color: var(--bz-ink-2); background: var(--bz-raised-2); color: var(--bz-ink); font-weight: 600; }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 14px; height: 2px; margin-left: -7px; border-radius: 1px; background: var(--bz-ink); }
.seg.compact { padding: 2px; border-radius: 13px; }
.seg.compact button { height: 40px; font-size: 13px; }
.seg.compact button[aria-pressed="true"]::after { bottom: 3px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip-btn { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bz-line); background: var(--bz-raised); font-size: 14px; }
.chip-btn strong { font-weight: 600; }
.time-pop { display: flex; align-items: center; gap: 8px; }
.time-pop input { height: 44px; padding: 0 10px; border-radius: var(--bz-r-ctl); border: 1px solid var(--bz-line); background: var(--bz-raised); color-scheme: dark; font-size: 16px; }
.link-btn { display: flex; align-items: center; height: 44px; padding: 0 4px; border: 0; background: transparent; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* buttons */
.primary { flex: 1; height: 52px; border-radius: var(--bz-r-card); border: 0; background: var(--bz-ink); color: var(--bz-on-light); text-decoration: none;
           font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
.primary:hover { color: var(--bz-on-light); background: #FFFFFF; }
.primary:disabled, .round:disabled { opacity: .4; cursor: default; }
.primary:disabled:hover { background: var(--bz-ink); }
.secondary { height: 52px; padding: 0 18px; border-radius: var(--bz-r-card); border: 1px solid var(--bz-edge); background: var(--bz-raised); text-decoration: none;
             font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }
.secondary.sm { height: 44px; font-size: 15px; }
.actions { display: flex; gap: 8px; margin-top: auto; }

/* route cards */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 340px) { .cards { grid-template-columns: 1fr; } }
.rcard { position: relative; text-align: left; min-height: 164px; padding: 12px; border-radius: var(--bz-r-card); border: 1.5px solid var(--bz-line);
         background: var(--bz-raised); display: flex; flex-direction: column; gap: 6px; }
.rcard[aria-pressed="true"] { border-color: var(--bz-ink); background: var(--bz-raised-2); }
.rcard.one { min-height: 0; border-color: var(--bz-ink); background: var(--bz-raised-2); }
.rcard .t { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 13px; font-weight: 600; }
.ring { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1.5px solid var(--bz-transit); display: flex; align-items: center; justify-content: center; }
.ring::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bz-ink); opacity: 0; }
[aria-pressed="true"] .ring { border-color: var(--bz-ink); }
[aria-pressed="true"] .ring::after { opacity: 1; }
.big { display: flex; align-items: flex-end; gap: 4px; height: 38px; }
.big .n { font-family: var(--bz-display); font-size: 34px; font-weight: 600; line-height: 38px; }
.big .u { font-size: 15px; font-weight: 500; color: var(--bz-ink-2); padding-bottom: 5px; }
.plus { margin-left: auto; margin-bottom: 7px; padding: 2px 6px; border-radius: 6px; background: var(--bz-ink); color: var(--bz-on-light); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.sbar { display: block; width: 100%; margin: 2px 0; }
.warnline { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; line-height: 1.4; }
.warnline svg { flex: none; margin-top: 1px; }
.lifelink { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--bz-r-ctl); background: var(--bz-raised);
            border: 1px solid var(--bz-line); text-decoration: none; font-size: 13px; line-height: 18px; text-align: left; width: 100%; }

/* overlays: legend, segment, about */
.panel { position: absolute; left: 12px; right: 12px; top: 64px; z-index: 1150; max-height: calc(100% - 80px); overflow-y: auto; padding: 14px; border-radius: var(--bz-r-card);
         background: var(--bz-panel); border: 1px solid var(--bz-edge); display: flex; flex-direction: column; gap: 10px; }
.panel .close { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.legend-grid { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 8px 12px; font-size: 14px; }
.legend-marks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--bz-ink-2); }
.legend-marks span { display: flex; align-items: center; gap: 6px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--bz-ink); }
.divider { height: 1px; background: var(--bz-line); flex: none; }
.src { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.4; color: var(--bz-ink-2); }
.src li { display: flex; gap: 8px; }
.src li::before { content: "—"; color: var(--bz-transit); }

/* search */
.s-head { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bz-panel); border-bottom: 1px solid var(--bz-line); }
.s-title { display: flex; align-items: center; gap: 4px; }
.s-title h1 { font-size: 17px; line-height: 22px; font-weight: 600; }
.back { width: 44px; height: 44px; margin-left: -10px; border-radius: var(--bz-r-ctl); border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex: none; }
.brand { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.fbtn { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0; text-align: left; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask-choices { display: flex; flex-direction: column; gap: 6px; }
.ask-choices[hidden] { display: none; }
.ask-choices p { margin: 4px 0 0; font-size: 13px; color: var(--bz-ink-2); }
.ask-choices button { min-height: 44px; width: 100%; padding: 10px 12px; text-align: left; white-space: normal;
  border: 1px solid var(--bz-line); border-radius: var(--bz-r-ctl); background: var(--bz-raised); color: var(--bz-ink); font-size: 15px; }
.ask-choices button:focus-visible { outline: 2px solid var(--bz-ink); outline-offset: 2px; }
.s-meta { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 6px; }
.s-list { list-style: none; margin: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
.s-list li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 62px; padding: 8px 12px 8px 10px;
             border-radius: var(--bz-r-ctl); border: 1px solid transparent; cursor: pointer; }
.s-list li[aria-selected="true"] { background: var(--bz-raised); border-color: var(--bz-transit); }
.s-list .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--bz-raised); display: flex; align-items: center; justify-content: center; color: var(--bz-ink-2); }
.s-list li[aria-selected="true"] .ic { background: var(--bz-ink); color: var(--bz-on-light); }
.s-list .nm { font-size: 16px; line-height: 21px; overflow: hidden; text-overflow: ellipsis; }
.s-list .nm strong { font-weight: 600; }
.s-list .dt { font-size: 13px; color: var(--bz-ink-2); }
.s-list .km { font-size: 13px; color: var(--bz-ink-2); }
.s-list li[aria-selected="true"] .km { color: var(--bz-ink); }
.help { margin: 14px 16px 0; padding: 14px; border-radius: var(--bz-r-card); background: var(--bz-panel); border: 1px solid var(--bz-line); display: flex; flex-direction: column; gap: 6px; }

/* details */
.prof { display: flex; gap: 0; height: 22px; align-items: center; }
.prof button { height: 22px; padding: 0; border: 0; background: transparent; min-width: 3px; display: block; border-radius: 3px; }
.prof button[aria-pressed="true"] { outline: 1.2px dashed var(--bz-ink); outline-offset: 2px; }
.prof svg { display: block; width: 100%; height: 22px; }
.ticks { display: flex; justify-content: space-between; font-family: var(--bz-mono); font-size: 11px; color: var(--bz-ink-3); }
.box { padding: 12px 14px; border-radius: var(--bz-r-card); background: var(--bz-raised); border: 1px solid var(--bz-line); display: flex; flex-direction: column; gap: 8px; }
details summary { display: flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13px; font-weight: 500; cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details[open] .chev { transform: rotate(90deg); }
.nlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.nlist li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.num { width: 18px; height: 18px; border: 1.5px solid var(--bz-ink); border-radius: 50%; font: 600 10px/1 var(--bz-display); display: flex; align-items: center; justify-content: center; }
.num.sq { border-radius: 4px; }

/* transit */
.tl { display: grid; gap: 3px; }
.tl > span { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tl small { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 15px; white-space: nowrap; overflow: hidden; }
.badge { padding: 0 5px; border-radius: 4px; background: var(--bz-ink); color: var(--bz-on-light); font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; }
.badge.lg { min-width: 34px; height: 26px; padding: 0 7px; border-radius: 6px; font: 600 15px/26px var(--bz-display); text-align: center; }
.livecard { padding: 12px 14px; border-radius: var(--bz-r-card); background: var(--bz-raised); border: 1px solid var(--bz-line); text-decoration: none; text-align: left;
            display: flex; flex-direction: column; gap: 6px; width: 100%; }
.livecard.old { border-style: dashed; border-color: var(--bz-transit); }
.lchip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--bz-edge); font-family: var(--bz-mono);
         font-size: 10.5px; line-height: 14px; font-weight: 500; letter-spacing: .05em; white-space: nowrap; }
.lchip.live { border-color: var(--bz-ink); }
.lchip.old, .lchip.none { border-style: dashed; border-color: var(--bz-transit); color: var(--bz-ink-2); }
.lchip.orar { border-color: var(--bz-transit); }
.bars { display: flex; gap: 2px; }
.bars i { width: 3px; height: 9px; border-radius: 1px; border: 1px solid var(--bz-edge); }
.bars i.on { background: var(--bz-ink); border-color: var(--bz-ink); }
.lchip.old .bars i { border-color: var(--bz-ink-3); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; }
.steps .tm { font-size: 12px; color: var(--bz-ink-2); padding-top: 1px; }
.dashed { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--bz-edge);
          font-size: 13px; color: var(--bz-ink-2); }
.dashed strong { color: var(--bz-ink); font-weight: 600; }
/* how the line ran around this hour on a recent day (../hist.js): one sentence, the source behind a tap */
.hist { padding: 6px 12px 6px 12px; border-radius: 10px; border: 1px solid var(--bz-line); }
.hist summary { align-items: flex-start; font-weight: 400; color: var(--bz-ink-2); line-height: 18px; padding: 3px 0; }
.hist summary strong { color: var(--bz-ink); font-weight: 600; }
.hist summary .chev { flex: none; margin-top: 3px; color: var(--bz-ink-3); }
.hist p { margin: 2px 0 4px 18px; }
.tag { font-family: var(--bz-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; color: var(--bz-ink-2); }
.huge { font-family: var(--bz-display); font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.stopcard { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 1100; padding: 12px 16px; border-radius: 18px; background: var(--bz-panel);
            border: 1px solid var(--bz-line); display: flex; align-items: center; gap: 12px; }
.warnbox { padding: 12px; border-radius: var(--bz-r-card); background: var(--bz-bg); border: 1px dashed var(--bz-ink-2); display: flex; flex-direction: column; gap: 10px; }
.warnbox.dark { border-color: #FF5A4F; }

/* ask in your own words (Gemini): design "Запрос своими словами" */
.ask-entry { display: flex; flex-direction: column; gap: 6px; }
.ask-open { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: var(--bz-r-ctl); border: 1px solid var(--bz-edge); background: var(--bz-raised);
            display: flex; align-items: center; gap: 10px; text-align: left; font-size: 15px; font-weight: 500; }
.ask-open svg { flex: none; }
.ask-open span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask-mic-sm { width: 48px; height: 48px; flex: none; padding: 0; border-radius: var(--bz-r-ctl); border: 1px solid var(--bz-edge); background: var(--bz-raised);
              display: flex; align-items: center; justify-content: center; }
.or-line { display: flex; align-items: center; gap: 10px; font-family: var(--bz-mono); font-size: 10.5px; line-height: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--bz-ink-3); }
.or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--bz-line); }
.ask-head { display: flex; align-items: center; gap: 4px; }
.ask-head h2 { flex: 1; min-width: 0; font-size: 17px; line-height: 22px; font-weight: 600; }
.ask-count { font-family: var(--bz-mono); font-size: 11px; color: var(--bz-ink-3); }
.ask-ta { width: 100%; height: 80px; flex: none; resize: none; padding: 11px 14px; border-radius: var(--bz-r-ctl); background: var(--bz-raised); border: 1.5px solid var(--bz-edge);
          color: var(--bz-ink); font: 16px/1.4 var(--bz-font); outline: none; }
.ask-ta:focus { border-color: var(--bz-ink); }
.ask-ta::placeholder { color: var(--bz-ink-3); }
.ask-ta[readonly] { opacity: .55; }
.ask-rec { height: 80px; flex: none; padding: 12px 14px; border-radius: var(--bz-r-ctl); background: var(--bz-bg); border: 1.5px solid var(--bz-ink);
           display: flex; flex-direction: column; justify-content: space-between; }
.ask-remain { font: 600 24px/1 var(--bz-display); }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bz-ink); }
.ask-voice { height: 80px; flex: none; padding: 0 14px; border-radius: var(--bz-r-ctl); background: var(--bz-raised); border: 1.5px solid var(--bz-edge);
             display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--bz-ink-2); }
.segs { display: grid; gap: 3px; }
.segs i { height: 6px; border-radius: 1px; border: 1px solid var(--bz-edge); }
.segs i.on { background: var(--bz-ink); border-color: var(--bz-ink); }
.segs i.now { background: var(--bz-ink-3); border-color: var(--bz-ink-3); animation: bzblink 1s ease-in-out infinite; }
.ask-btns { display: flex; gap: 10px; }
.ask-mic { width: 56px; height: 56px; flex: none; padding: 0; border-radius: 999px; border: 1.5px solid var(--bz-edge); background: var(--bz-raised);
           display: flex; align-items: center; justify-content: center; }
.ask-mic[aria-pressed="true"] { background: var(--bz-ink); border-color: var(--bz-ink); color: var(--bz-on-light); }
.ask-mic:disabled { opacity: .4; cursor: default; }
.ask-mic.off { opacity: 1; background: transparent; border-style: dashed; border-color: var(--bz-transit); color: var(--bz-ink-3); }
.ask-go { flex: 1; height: 56px; border-radius: var(--bz-r-card); border: 1px solid var(--bz-ink); background: var(--bz-ink); color: var(--bz-on-light);
          font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ask-go:disabled { background: var(--bz-raised); color: var(--bz-ink-3); border-style: dashed; border-color: var(--bz-edge); cursor: default; }
.ask-msg { padding: 12px 14px; border-radius: var(--bz-r-ctl); border: 1px dashed var(--bz-ink-2); background: var(--bz-bg); display: flex; flex-direction: column; gap: 10px; }
.ask-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
.ask-line svg { flex: none; margin-top: 1px; }
.ask-exs { display: flex; flex-direction: column; gap: 6px; }
.ask-ex { display: flex; flex-wrap: wrap; gap: 8px; }
.ask-ex button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bz-edge); background: transparent; font-size: 13px; color: var(--bz-ink-2); text-align: left; }
.ask-card { position: relative; padding: 12px 10px 12px 14px; border-radius: var(--bz-r-card); border: 1px solid var(--bz-ink); background: var(--bz-raised); display: flex; flex-direction: column; gap: 4px; }
.ask-card.miss { padding-bottom: 4px; border: 1px dashed var(--bz-ink-2); gap: 2px; }
.ask-card .top-row { display: flex; align-items: center; min-height: 20px; padding-right: 150px; }
.edit-link { height: 44px; padding: 0 10px; border: 0; background: transparent; font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.calc { height: 44px; margin-top: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--bz-ink-2); }
.calc i { width: 4px; height: 12px; border-radius: 1px; background: var(--bz-edge); }
.calc i:first-child { background: var(--bz-ink); }
.calc i:nth-child(2) { background: var(--bz-transit); }
.from-ask { flex: none; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--bz-edge); font-family: var(--bz-mono); font-size: 10px; line-height: 14px; color: var(--bz-ink-2); }
.field.miss { border: 1.5px dashed var(--bz-ink); }
@keyframes bzblink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
.blink { animation: bzblink 1s ease-in-out infinite; }
.pulse { animation: bzblink 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .blink, .pulse, .segs i.now { animation: none; } }

/* navigation */
.manoeuvre { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 1100; border-radius: 18px; background: var(--bz-panel); border: 1px solid var(--bz-line); overflow: hidden; }
.manoeuvre .main { display: flex; align-items: center; gap: 14px; padding: 14px 16px 12px; }
.manoeuvre .dist { font-family: var(--bz-display); font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.manoeuvre .then { padding: 9px 16px; border-top: 1px solid var(--bz-line); font-size: 14px; color: var(--bz-ink-2); display: flex; align-items: center; gap: 8px; }
.side { position: absolute; right: 12px; z-index: 1100; display: flex; flex-direction: column; gap: 10px; }
.side .round { width: 48px; height: 48px; }

.menu { position: absolute; top: 64px; right: 12px; z-index: 1160; width: 210px; padding: 6px; border-radius: var(--bz-r-card); background: var(--bz-panel);
        border: 1px solid var(--bz-edge); display: flex; flex-direction: column; gap: 2px; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
.menu button { height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; gap: 10px; font-size: 15px; text-align: left; }
.menu button[aria-checked="true"] { background: var(--bz-raised-2); font-weight: 600; }
.menu button:hover { background: var(--bz-raised); }
/* leaving time: drums */
.tp-back { position: absolute; inset: 0; z-index: 1250; background: rgba(0,0,0,.55); }
.tp { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1260; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: var(--bz-r-sheet) var(--bz-r-sheet) 0 0;
      background: var(--bz-panel); border-top: 1px solid var(--bz-line); display: flex; flex-direction: column; gap: 12px; animation: tpup .28s var(--bz-ease-out) both; }
@keyframes tpup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.tp-wheels { position: relative; display: flex; justify-content: center; align-items: center; gap: 18px; height: 220px; }
.tp-band { position: absolute; left: 50%; width: 260px; margin-left: -130px; top: 88px; height: 44px; border-top: 2px solid var(--bz-edge); border-bottom: 2px solid var(--bz-edge); pointer-events: none; }
.tp-col { position: relative; width: 96px; height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; padding: 88px 0;
          scrollbar-width: none; touch-action: pan-y; cursor: grab; user-select: none; outline-offset: -2px;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 38%, #000 62%, transparent 100%);
                  mask-image: linear-gradient(to bottom, transparent 0, #000 38%, #000 62%, transparent 100%); }
.tp-col::-webkit-scrollbar { display: none; }
.tp-col:focus-visible { outline: none; }
.tp-col:focus-visible .tp-i.on { text-decoration: underline 2px; text-underline-offset: 7px; }
.tp-col:active { cursor: grabbing; }
.tp-i { height: 44px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; font: 500 22px/1 var(--bz-display); color: var(--bz-ink-3);
        transition: color .12s, font-size .12s; }
.tp-i.on { color: var(--bz-ink); font-size: 30px; font-weight: 600; }
.tp-colon { font: 600 28px/1 var(--bz-display); color: var(--bz-ink-2); }
@media (prefers-reduced-motion: reduce) { .tp { animation: none; } .tp-i { transition: none; } }
.toast { position: absolute; left: 12px; right: 12px; top: 68px; z-index: 1300; padding: 12px 14px; border-radius: var(--bz-r-card); background: var(--bz-panel);
         border: 1px dashed var(--bz-ink-2); font-size: 14px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; }
.toast button { margin-left: auto; }
.loading { padding: 18px 0; text-align: center; color: var(--bz-ink-2); font-size: 14px; }
.fade { transition: opacity .25s var(--bz-ease-out); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="bzglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
    <radialGradient id="bzhalo"><stop offset="0" stop-color="#F2F2F2" stop-opacity="0.24"></stop><stop offset="1" stop-color="#F2F2F2" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="bzhead"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="bzcone" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2F2F2" stop-opacity="0.3"></stop><stop offset="1" stop-color="#F2F2F2" stop-opacity="0"></stop></linearGradient>
  </defs>
</svg>
<div id="phone">
  <div id="map" role="region"></div>
  <div id="screen"></div>
  <!-- search: built once by m.js and kept with its listeners -->
  <section id="scr-search" class="full" hidden></section>
  <p id="sr-live" class="sr" role="status" aria-live="polite"></p>
  <div id="overlay"></div>
  <div id="toast" class="toast" role="alert" hidden></div>
</div>
