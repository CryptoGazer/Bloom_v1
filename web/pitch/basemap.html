<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bezna — fundal</title>
<!-- A background for the pitch slides: our dark basemap of the centre of Timișoara, nothing on it.
     ?z= zoom (default 15), ?net=1 adds the faint lighting network. -->
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
html, body { height: 100%; margin: 0; background: #0B0B0B; overflow: hidden; }
#map { position: absolute; inset: 0; background: #0B0B0B; }
.leaflet-container { background: #0B0B0B; }
.bz-tiles { filter: invert(1) grayscale(1) brightness(.5) contrast(1.25); }
.leaflet-control-attribution { background: transparent !important; color: #4A4A4A; font: 10px system-ui, sans-serif; }
.leaflet-control-attribution a { color: #4A4A4A; text-decoration: none; }
</style>
</head>
<body>
<div id="map"></div>
<script src="../vendor/leaflet/leaflet.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const map = L.map('map', { zoomControl: false, zoomSnap: 0.25, fadeAnimation: false });
map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'bz-tiles', attribution: '© OpenStreetMap' }).addTo(map);
map.setView([45.7545, 21.2290], +(q.get('z') || 15));      // Piața Victoriei, the old town and the Bega
if (q.get('net')) {
  const NET = { lit_confirmed: ['#F2F2F2', 0.22, null], lit_likely: ['#FFC83D', 0.4, '8 5'], unknown: ['#8A8A8A', 0.45, '0.1 6'], dark_reported: ['#FF5A4F', 0.55, '7 5 0.1 5'] };
  const b = map.getBounds().pad(0.1);
  fetch(`/api/segments?bbox=${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}&limit=8000`).then(r => r.json()).then(d => {
    for (const [k, [color, opacity, dash]] of Object.entries(NET)) {
      const lines = d.features.filter(f => f.properties.status === k).map(f => f.geometry.coordinates.map(c => [c[1], c[0]]));
      if (lines.length) L.polyline(lines, { color, opacity, weight: 1.6, dashArray: dash, interactive: false }).addTo(map);
    }
  });
}
</script>
</body>
</html>
